<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบผลการเรียน</title>
  <!-- Tailwind CSS & Google Fonts (Sarabun) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen py-4 px-3 sm:py-8 sm:px-6">
  <div class="max-w-xl mx-auto space-y-4 sm:space-y-6">
    
    <!-- Card Search -->
    <div class="bg-white rounded-2xl shadow-md p-5 sm:p-8 border border-gray-100">
      <div class="text-center mb-5">
        <!-- Logo สกร. -->
        <div class="mb-3 flex justify-center">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Emblem_of_the_Department_of_Learning_Encouragement.png" alt="ตรา สกร." class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
        </div>
        <!-- ชื่อหน่วยงาน -->
        <h2 class="text-base sm:text-lg font-bold text-gray-700 mb-1">ศูนย์ส่งเสริมการเรียนรู้ระดับอำเภอโกสุมพิสัย</h2>
        
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800">ตรวจสอบผลการเรียน</h1>
        <p class="text-gray-400 text-xs sm:text-sm mt-1">กรอกรหัสนักเรียน (ไม่ต้องใส่ขีด - ได้)</p>
      </div>

      <form id="searchForm" onsubmit="handleSearch(event)" class="space-y-3">
        <div>
          <input type="text" id="keyword" required placeholder="เช่น 6723000466"
            class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 outline-none text-gray-800 text-base shadow-sm">
        </div>

        <button type="submit" id="btnSubmit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center space-x-2 text-base">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <span>ค้นหาข้อมูล</span>
        </button>
      </form>
    </div>

    <!-- Alert / Error Message -->
    <div id="errorAlert" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-xl text-red-700 text-sm shadow-sm"></div>

    <!-- Loading Spinner -->
    <div id="loading" class="hidden text-center py-10">
      <div class="inline-block animate-spin rounded-full h-9 w-9 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="mt-2 text-gray-500 text-sm font-medium">กำลังค้นหาข้อมูล...</p>
    </div>

    <!-- Result Container -->
    <div id="resultContainer" class="hidden space-y-4">
      
      <!-- Student Info Card -->
      <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl shadow-lg p-5 text-white">
        <div id="reportTitle" class="text-[11px] sm:text-xs text-indigo-200 font-medium mb-2 border-b border-white/20 pb-2"></div>
        <div class="flex items-start justify-between gap-3">
          <div class="space-y-1">
            <h2 id="studentName" class="text-lg sm:text-xl font-bold leading-snug"></h2>
            <p id="studentId" class="text-indigo-100 text-xs sm:text-sm"></p>
          </div>
          <div class="bg-white/15 backdrop-blur-md rounded-xl p-2.5 text-center min-w-[95px] shadow-inner shrink-0">
            <span class="block text-[10px] text-indigo-100 uppercase tracking-wider">เกรดเฉลี่ยรวม</span>
            <span id="gpaTotal" class="text-xl sm:text-2xl font-black text-white"></span>
          </div>
        </div>
      </div>

      <!-- Summary Statistics -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
          <span class="text-[11px] text-gray-400 block">เกรดเฉลี่ย</span>
          <span id="gpa" class="text-lg font-bold text-indigo-600">-</span>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
          <span class="text-[11px] text-gray-400 block">วิชาบังคับ</span>
          <span id="compulsory" class="text-lg font-bold text-gray-800">-</span>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
          <span class="text-[11px] text-gray-400 block">วิชาเลือก</span>
          <span id="elective" class="text-lg font-bold text-gray-800">-</span>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
          <span class="text-[11px] text-gray-400 block">ชั่วโมงกิจกรรม</span>
          <span id="activity" class="text-lg font-bold text-green-600">-</span>
        </div>
      </div>

      <!-- Grade Details Table -->
      <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
        <div class="px-4 py-3 bg-gray-50/80 border-b border-gray-100">
          <h3 class="font-bold text-gray-800 text-sm sm:text-base">รายวิชาที่ลงทะเบียนเรียน</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead>
              <tr class="bg-gray-50 text-gray-500 uppercase tracking-wider text-[11px]">
                <th class="py-2.5 px-3 font-semibold text-center w-12">ลำดับ</th>
                <th class="py-2.5 px-3 font-semibold">รหัสวิชา</th>
                <th class="py-2.5 px-3 font-semibold text-center">คะแนน</th>
                <th class="py-2.5 px-3 font-semibold text-center">เกรด</th>
              </tr>
            </thead>
            <tbody id="subjectTableBody" class="divide-y divide-gray-100 text-gray-700">
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    // ** นำ Web App URL ที่ได้จาก Step 1 มาวางที่นี่ **
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxiwzTZJv5KVnQiO8nNQA99WGf7ThCoYpYcHOzV8DgGZ-MZo7f3v-DrTMDPFLuG6nO1/exec';

    async function handleSearch(event) {
      event.preventDefault();
      const keyword = document.getElementById('keyword').value.trim();
      if (!keyword) return;

      showError('');
      document.getElementById('resultContainer').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('btnSubmit').disabled = true;

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?keyword=${encodeURIComponent(keyword)}`);
        const data = await response.json();
        onSuccess(data);
      } catch (error) {
        onFailure(error);
      }
    }

    function onSuccess(response) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('btnSubmit').disabled = false;

      if (!response.success) {
        showError(response.message);
        return;
      }

      const data = response.data;

      document.getElementById('reportTitle').innerText = data.title;
      document.getElementById('studentName').innerText = data.studentName || data.fullInfo;
      document.getElementById('studentId').innerText = data.studentId ? 'รหัสประจำตัว: ' + data.studentId : '';

      document.getElementById('gpaTotal').innerText = data.summary['เกรดเฉลี่ยรวม'] || '-';
      document.getElementById('gpa').innerText = data.summary['เกรดเฉลี่ย'] || '-';
      document.getElementById('compulsory').innerText = data.summary['วิชาบังคับ'] || '-';
      document.getElementById('elective').innerText = data.summary['วิชาเลือก'] || '-';
      document.getElementById('activity').innerText = data.summary['กิจกรรม'] || '-';

      const tbody = document.getElementById('subjectTableBody');
      tbody.innerHTML = '';

      if (data.subjects.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-gray-400">ไม่พบข้อมูลรายวิชา</td></tr>';
      } else {
        data.subjects.forEach((item, index) => {
          const row = document.createElement('tr');
          row.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/60';
          
          row.innerHTML = `
            <td class="py-3 px-3 text-center text-gray-400 font-medium">${index + 1}</td>
            <td class="py-3 px-3 font-semibold text-gray-800">${item.code}</td>
            <td class="py-3 px-3 text-center text-gray-600">${item.score}</td>
            <td class="py-3 px-3 text-center">
              <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm ${getGradeBadgeClass(item.grade)}">
                ${item.grade}
              </span>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      document.getElementById('resultContainer').classList.remove('hidden');
    }

    function onFailure(error) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('btnSubmit').disabled = false;
      showError('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: ' + error.message);
    }

    function showError(msg) {
      const alert = document.getElementById('errorAlert');
      if (msg) {
        alert.innerText = msg;
        alert.classList.remove('hidden');
      } else {
        alert.classList.add('hidden');
      }
    }

    function getGradeBadgeClass(grade) {
      const numGrade = parseFloat(grade);
      if (isNaN(numGrade)) return 'bg-gray-100 text-gray-700';
      if (numGrade >= 3.5) return 'bg-emerald-100 text-emerald-800';
      if (numGrade >= 2.5) return 'bg-blue-100 text-blue-800';
      if (numGrade >= 1.5) return 'bg-amber-100 text-amber-800';
      return 'bg-rose-100 text-rose-800';
    }
  </script>
</body>
</html>
